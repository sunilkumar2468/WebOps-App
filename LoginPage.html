<! doctype html>
<head>
  <style>
    body {
      background-image: url('Wallpaper.jpg');
      background-size: cover;
      background-attachment: fixed;
      text-align: center;
      font-family: Arial, sans-serif;
    }
    
    h1, h2 {
      background-color: white;
      display: inline-block;
      padding: 10px 20px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .contact-container {
      width: 400px;
      margin: 0 auto;
      padding: 20px;
      background-color: white;
      text-align: left;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    input, textarea {
      width: 90%;
      padding: 8px;
      margin-top: 5px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    #rollno, #dob {
      width: 150px;
    }

    input:focus, textarea:focus {
      border: 2px solid blue;
      background-color: #f4f8ff;
      outline: none;
    }

    button {
      padding: 10px 15px;
      background-color: blue;
      color: white;
      border: none;
      border-radius: 4px;
    }

    button:hover {
      background-color: darkblue;
      cursor: pointer;
    }

    table {
      background-color: white;
      margin: 0 auto;
      font-size: 18px;
      border-collapse: collapse;
      width: 60%;
    }

    th, td {
      padding: 10px;
      border: 1px solid black;
    }

    .my-list {
      background-color: white;
      width: 350px;
      margin: 0 auto;
      text-align: left;
      padding: 20px 40px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
  </style>
</head>


<body>
<h1>Individual Student Profile</h1>
  <form>
    <br><br><br>
    <label for='rollno'>Roll No:</label>
    <input type='text' id='rollno' name='rollno' pattern='[A-Za-z]{2}[0-9]{2}[A-Za-z]{1}[0-9]{3}' placeholder="EE26B141" required>
    <br>
    <label for='dob'>Date of Birth:</label>
    <input type='date' id='dob' name='dob' placeholder="11-11-2011" required>
    <br><br>
    <button type='submit'>Submit</button>
    <br><br><br><br>
  </form>

<h2>Counter</h2>

<p id="count">0</p>

<button onclick="increase()">Increase</button>
<button onclick="decrease()">Decrease</button>

<br><br><br>

<script>
  let count = 0;

  function increase() {count++;document.getElementById("count").innerHTML = count;}

  function decrease() {
    count--;
    document.getElementById("count").innerHTML = count;
  }

  
</script>

<table border="1" style='font-size: 20px; margin-left: auto; margin-right: auto; text-align:center':>
  <tr>
    <th>S.No</th>
    <th>Attender</th>
    <th>Contact number</th>
  </tr>
  <tr>
    <td>1.</td>
    <td>Admin</td>
    <td>9123456780</td>
  </tr>
  <tr>
    <td>2.</td>
    <td>Security</td>
    <td>9234567801</td>
  </tr>
</table>
<br><br><br><br><br><br><br>

<footer class="contact-footer">
        <div class="contact-container">
            <h3>Contact Us</h3>
            <p>We'd love to hear from you!</p>
            
            <form>
		<label for='name'>Name: </label>
		<input type='text' id='name' name='name' pattern='[A-Za-z]+' placeholder='Alex' required>
		<br>
		<label for='emailid'>E-mail ID: </label>
		<input type='email' id='emailid' name='emailid' pattern='+[.]+' placeholder='abcd@gmail.com' required>
		<br>
		<label for='rollno'>Roll No:</label>
    		<input type='text' id='rollno' name='rollno' pattern='[A-Za-z]{2}[0-9]{2}[A-Za-z]{1}[0-9]{3}' placeholder="EE26B141" required>
    		<br>
		<label for='dob'>Date of Birth:</label>
    		<input type='date' id='dob' name='dob' placeholder="11-11-2011" required>
    		<br><br>

		<label for='rem'>Remarks: </label>
		<textarea id="rem" name="rem" placeholder="Type your queries here" required></textarea>
		<br>
		<button type='submit'>Submit</button>
            </form>	  

        </div>
    </footer>


</body>
</html>
